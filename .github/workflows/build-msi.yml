name: Build MSI

# Downloads the latest GitHub Release (<Repo>-<tag>-x64.zip) of each component
# repo listed in artifacts.json and packages them into a single MSI, published
# as this run's "ComponentSuite-<version>" artifact.
#
# No secrets needed while the component repos are public: release assets are
# public, and the workflow's own token is only used for a higher API rate limit.
#
# Every build except a pull request also publishes the MSI as a GitHub Release,
# tagged v<version> automatically - no manual tagging needed. Versions are
# <VERSION_PREFIX>.<run number>, so each build is newer than the last and
# upgrades over the previous install. Pushing a v*.*.* tag yourself still works
# and releases exactly that version.

env:
  VERSION_PREFIX: "1.1"   # major.minor of automatic versions; bump for e.g. 2.0

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      version:
        description: "Product version (major.minor.build). Default: VERSION_PREFIX.<run number>"
        required: false
      allow_missing:
        description: "Leave out components that have no release yet instead of failing"
        type: boolean
        default: false
  # Lets a component repo trigger a rebuild after it publishes a release:
  #   gh api repos/<owner>/<this-repo>/dispatches -f event_type=component-built
  repository_dispatch:
    types: [component-built]

jobs:
  msi:
    runs-on: windows-2022
    permissions:
      contents: write   # create the tag + GitHub Release for each build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v -and '${{ github.ref_type }}' -eq 'tag') { $v = '${{ github.ref_name }}'.TrimStart('v') }
          if (-not $v) { $v = "$env:VERSION_PREFIX.${{ github.run_number }}" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Version '$v' must be major.minor.build (numbers only)"; exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Fetch component releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Fetch-Artifacts.ps1 -AllowMissing:$${{ github.event.inputs.allow_missing == 'true' }}

      - name: Build MSI
        shell: pwsh
        run: ./build.ps1 -SkipFetch -Version ${{ steps.ver.outputs.version }}

      # Component table for the run summary, reused as the release notes.
      - name: Summary
        id: summary
        shell: pwsh
        run: |
          $info = Get-Content out/staging/build-info.json -Raw | ConvertFrom-Json
          $lines = @("### ComponentSuite ${{ steps.ver.outputs.version }}", '', '| Component | Repo | Release | Commit |', '|---|---|---|---|')
          foreach ($p in $info.components.PSObject.Properties) {
            $c = $p.Value
            $commit  = if ($c.PSObject.Properties['commit'] -and $c.commit) { "``$($c.commit.Substring(0,7))``" } else { '-' }
            $release = if ($c.PSObject.Properties['tag'] -and $c.tag) { "[$($c.tag)]($($c.releaseUrl))" } else { '-' }
            $lines += "| $($p.Name) | $($c.repo) | $release | $commit |"
          }
          $missing = $info.PSObject.Properties['missing'] -and $info.missing
          if ($missing) { $lines += '', "**Left out:** $($info.missing -join ', ')" }
          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY
          $lines -join "`n" | Set-Content out/release-notes.md -Encoding utf8
          "missing=$(if ($missing) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # Versioned file name, so downloads from different releases don't collide.
      - name: Name MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/release | Out-Null
          Copy-Item out/msi/ComponentSuite.msi "out/release/ComponentSuite-${{ steps.ver.outputs.version }}.msi"

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: ComponentSuite-${{ steps.ver.outputs.version }}
          path: |
            out/release/*.msi
            out/staging/build-info.json
          if-no-files-found: error

      # Runs only when every step above succeeded (fetch, MSI build, upload).
      # Pull requests only build. Everything else becomes a release: a pushed
      # v*.*.* tag releases under that tag; otherwise tag v<version> is created
      # on the commit that was built. A build that left components out (manual
      # run with allow_missing) is marked as a pre-release so it never becomes
      # "latest".
      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ComponentSuite ${{ steps.ver.outputs.version }}
          body_path: out/release-notes.md
          files: out/release/*.msi
          prerelease: ${{ steps.summary.outputs.missing == 'true' }}
